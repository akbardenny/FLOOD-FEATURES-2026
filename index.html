<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOOD FUTURES - WebGIS 3D Desa Sidodadi</title>
    
    <!-- Memanggil Library CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Memanggil Library Turf.js untuk Analisis Spasial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
    
    <!-- Memanggil file desain -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kontainer untuk Peta 3D -->
    <div id="cesiumContainer"></div>
    
    <!-- INDIKATOR LOADING (Tampil saat memuat data) -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Memuat Data Spasial...</p>
    </div>

    <!-- Panel Kontrol Skenario & Mitigasi -->
    <div class="control-panel">
        <h2>FLOOD FUTURES</h2>
        <p>Desa Sidodadi, Teluk Pandan, Pesawaran</p>
        <hr>
        <h3>Skenario Genangan Banjir</h3>
        <button onclick="loadFlood('normal')">Kondisi Normal</button>
        <button onclick="loadFlood('rendah')">Skenario Rendah (50 cm)</button>
        <button onclick="loadFlood('sedang')">Skenario Sedang (1 m)</button>
        <button onclick="loadFlood('tinggi')">Skenario Tinggi (1.5 m)</button>
        
        <hr>
        <h3>Mitigasi & Evakuasi</h3>
        <button onclick="loadEvacuationRoute()" style="background-color: #e74c3c;">Tampilkan Jalur Evakuasi</button>

        <div class="keterangan">
            <p><strong>Note:</strong> Pilih skenario genangan atau jalur evakuasi untuk melihat simulasi 3D.</p>
        </div>
    </div>

    <!-- Memanggil file logika peta -->
    <script src="app.js"></script>
</body>
</html>
